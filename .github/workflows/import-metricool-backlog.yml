          get "https://static.metricool.com/planner/202609/6793442-file-6846909153035095122.png" "tiktok/2026-09-12-microloading/04.png"
          get "https://static.metricool.com/planner/202609/6793442-file-5076421719459701338.png" "tiktok/2026-09-12-microloading/05.png"
          get "https://static.metricool.com/planner/202609/6793442-file-1184455811342682649.png" "tiktok/2026-09-12-microloading/06.png"
          get "https://static.metricool.com/planner/202609/6793442-file-5958419401050959099.png" "tiktok/2026-09-12-microloading/07.png"
          get "https://static.metricool.com/planner/202609/6793442-file-11802062759096543682.png" "tiktok/2026-09-12-microloading/08.png"

      - name: Commit imported media
        shell: bash
        run: |
          git config user.name "after-office-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tiktok/
          if git diff --cached --quiet; then
            echo "No media changes to commit."
          else
            git commit -m "Import TikTok backlog media"
            git push
          fi
