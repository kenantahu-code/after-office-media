          get "https://static.metricool.com/planner/202609/6793442-file-15416904822201110039.jpeg" "tiktok/2026-09-11-mmc/05.jpg"
          get "https://static.metricool.com/planner/202609/6793442-file-9841815192342034220.jpeg" "tiktok/2026-09-11-mmc/06.jpg"
          get "https://static.metricool.com/planner/202609/6793442-file-5549028002435498037.jpeg" "tiktok/2026-09-11-mmc/07.jpg"
          get "https://static.metricool.com/planner/202609/6793442-file-6442814675690902084.jpeg" "tiktok/2026-09-11-mmc/08.jpg"

          # 2026-09-12 — Progress kecil tetap progress: microloading
